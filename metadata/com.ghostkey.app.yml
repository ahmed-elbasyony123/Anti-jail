IssueTracker: https://github.com/ahmed-elbasyony123/GHOSTKEY/issues
Changelog: https://github.com/ahmed-elbasyony123/GHOSTKEY/releases

AutoName: GhostKey

RepoType: git
Repo: https://github.com/ahmed-elbasyony123/GHOSTKEY.git

Builds:
  - versionName: 3.0.1
    versionCode: 29
    commit: v3.0.1
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential pkg-config curl
    gradle:
      - yes
    scandelete:
      - server
      - android/app/src/main/jniLibs
    prebuild:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.0
      - source "$HOME/.cargo/env"
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk --locked
    build:
      - source "$HOME/.cargo/env"
      - pushd ../../rust/arti-mobile
      - ANDROID_NDK_HOME=$$NDK$$ cargo ndk -t arm64-v8a -p 26 -o ../../android/app/src/main/jniLibs build --release
      - popd
    ndk: r27c

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 3.0.1
CurrentVersionCode: 29
