name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview (debug build)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Debug-signed APK, not independently audited. Uses wire protocol v2, so it only
            works with a relay running the matching v2 server code.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "GhostKey v2.1.0 (Security Hardening & 15MB Media)"
          body: |
            ### 🛡️ GhostKey v2.1.0 (Protocol v2.1 Hardening & Optimization)
            - **Drop-ID Cryptographic Derivation:** `dropId = SHA-256("drop:" + readToken)` prevents mailbox squatting and front-running
            - **Replay Attack Defense:** Monotonic timestamp window and nonce deduplication in signed wire format
            - **Media Capacity Upgrade:** Raised uncompressed attachment limit to 15 MB with streaming server pipeline (25 MB cap)
            - **Forensic Hardening:** Cleartext relay URL removed from disk in Ephemeral mode; system clipboard automatically cleared after 45s and on panic wipe
            - **Stealth Notifications:** Renamed foreground service to neutral system task to prevent lock-screen eavesdropping
            - **Web Client Security:** Eliminated `dangerouslySetInnerHTML` in React companion; strictly sandboxed inline media
            - **Server Crash Resilience:** Added global unhandled rejection & exception handlers with rate-limited auth protection
            - **ProGuard / R8 Hardening:** Removed wildcard keep rules for maximum binary obfuscation and footprint minimization
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
