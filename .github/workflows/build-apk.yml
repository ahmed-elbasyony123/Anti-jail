name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Cache Arti Native Libraries (libarti_mobile.so)
        id: cache-arti
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: arti-jni-arm64-v1-${{ hashFiles('rust/arti-mobile/**') }}

      - name: Set up Rust Toolchain
        if: steps.cache-arti.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        if: steps.cache-arti.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Build Arti Tor Native Libraries (arm64-v8a)
        if: steps.cache-arti.outputs.cache-hit != 'true'
        working-directory: ./rust/arti-mobile
        run: |
          mkdir -p ../../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a --platform 26 -o ../../android/app/src/main/jniLibs build --release

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview (debug build)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Debug-signed APK with Embedded Arti Tor engine. Uses wire protocol v2.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0
          name: "GhostKey v2.6.0 (Live QR Pairing, In-App PIN Lock & Welcome Flow)"
          body: |
            ### 🛡️ GhostKey v2.5.2 (Critical Security & Architecture Hardening)
            - **Contact Message Routing & Signature Verification:**
              - Decryption now verifies OpenPGP signatures against all saved contacts, eliminating message routing failures and preventing messages from landing in the user's own drop ID.
            - **Group Messaging Fixes:**
              - De-duplicated group message echo using outbound ciphertext tracking.
              - Full media and voice note rendering in groups (images, attachments, and Opus waveforms).
              - Background push notifications for group messages.
            - **Tor & Network Engine Hardening:**
              - Fixed Arti Tor compilation: replaced `static mut` with thread-safe `Mutex<Option<oneshot::Sender<()>>>`.
              - Early SOCKS5 listener bind with `ARTI_FS_DISABLE_PERMISSION_CHECKS` bypass for Android container sandbox.
              - Smart DNS routing: dummy IP for `.onion` hosts, native IP resolution for direct cloud relays.
              - Safe URL scheme enforcement (`https://` for external domains, `http://` for `.onion` and loopback).
            - **Anti-Forensics & UI Polish:**
              - Memory zeroization before audio player release on panic wipe (`AudioPlayerManager.wipe`).
              - Real-time descriptive connectivity status indicator in ChatsList and Chat screens.
              - One-tap "Copy Full Public Key" button in Telegram navigation drawer.
              - Rate limiter memory leak fixed in relay server garbage collection.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
