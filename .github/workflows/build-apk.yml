name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Arti Tor Native Libraries
        working-directory: ./rust/arti-mobile
        run: |
          mkdir -p ../../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o ../../android/app/src/main/jniLibs build --release

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview (debug build)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Debug-signed APK with Embedded Arti Tor engine. Uses wire protocol v2.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: "GhostKey v2.3.0 (Embedded Arti Tor Engine - Zero Config Onion Routing)"
          body: |
            ### 🧅 GhostKey v2.3.0 (Embedded Arti Tor Engine & Zero-Config Privacy)
            - **Embedded Arti Tor Engine (Rust):** Official Tor Project Next-Gen Rust engine (`arti-client`) running completely in-process. Eliminates the requirement to install Orbot or third-party VPN apps!
            - **Zero Local DNS Leaks:** DNS resolution for `.onion` and relay targets is performed strictly inside isolated Tor memory circuits.
            - **In-Process SOCKS5 Proxy:** Seamlessly bridges OkHttp and WebSocket connections to embedded Tor Onion circuits.
            - **Live Tor Bootstrap Monitor:** Real-time bootstrap progress (`ARTI: XX%` / `ARTI: READY`) directly in the app status header.
            - **Encrypted Opus PTT Voice Messaging:** Instant RAM-only Push-to-Talk voice notes with zero disk persistence and panic wipe sanitization.
            - **Clean Outgoing Bubble Rendering:** Polished message bubbles without wire wrapper leakage.
            - **Fallback Support:** Graceful backward-compatible fallback to external Orbot on unsupported platforms.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
