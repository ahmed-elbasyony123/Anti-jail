name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-stealth
          name: "GhostKey v1.0.0 Stealth APK"
          body: |
            ### 🛡️ GhostKey v1.0.0-stealth APK
            - **End-to-End Encryption:** OpenKeychain (OpenPGP Curve25519)
            - **ISP Anonymity:** Tor v3 Onion Routing & SOCKS5 (Orbot)
            - **Ephemeral Drop:** RAM-only blind mailbox with Burn-on-Read
            - **Multimedia Support:** Encrypted Photos, Audio & Documents
            - **Anti-Forensics:** FLAG_SECURE & Emergency Panic Wipe
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
