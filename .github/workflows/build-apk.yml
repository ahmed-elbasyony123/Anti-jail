name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Arti Tor Native Libraries
        working-directory: ./rust/arti-mobile
        run: |
          mkdir -p ../../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../android/app/src/main/jniLibs build --release

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview (debug build)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Debug-signed APK, not independently audited. Uses wire protocol v2, so it only
            works with a relay running the matching v2 server code.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "GhostKey v2.2.0 (Encrypted Opus PTT Voice Notes & Clean UI)"
          body: |
            ### 🎙️ GhostKey v2.2.0 (Encrypted PTT Voice Notes & Clean UI)
            - **Opus Encrypted PTT Voice Messaging:** High-fidelity voice notes using native Opus encoding (`.ogg`) at 32 kbps / 48 kHz.
            - **RAM-Only Zero-Footprint Audio:** Instant temporary file shredding (zero-fill on disk); playback handled 100% in volatile RAM via `MemoryAudioDataSource` with no disk writes.
            - **Panic Wipe Audio Sanitization:** Instant purge and memory zeroing of all audio buffers upon emergency panic wipe.
            - **Clean Outgoing Bubble Rendering:** Eliminated the raw wire JSON envelope (`{"v":2, "pad":...}`) from outgoing message bubbles, showing clean text only.
            - **Modular Stealth UI:** Dedicated `AudioBubble.kt` player widget with glowing progress slider, duration timers, and live `REC` recording indicator.
            - **Cryptographic Envelope:** Audio payloads are signed with Ed25519 and encrypted using AES-256 + X25519 over Tor Onion Routing.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
