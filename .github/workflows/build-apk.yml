name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Cache Arti Native Libraries (libarti_mobile.so)
        id: cache-arti
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: arti-jni-arm64-v2-${{ hashFiles('rust/arti-mobile/**') }}

      - name: Set up Rust Toolchain
        if: steps.cache-arti.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        if: steps.cache-arti.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Build Arti Tor Native Libraries (arm64-v8a)
        if: steps.cache-arti.outputs.cache-hit != 'true'
        working-directory: ./rust/arti-mobile
        run: |
          mkdir -p ../../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a --platform 26 -o ../../android/app/src/main/jniLibs build --release

      - name: Run Core & Mesh Unit Tests
        working-directory: ./android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Shrunk Release APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            R8-shrunk APK with Embedded Arti Tor engine. Uses wire protocol v2.
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Release Tag & Metadata
        if: github.ref == 'refs/heads/main'
        id: release_meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts || echo "2.7.1")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            TAG="v${VERSION}-build.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          echo "title=GhostKey ${TAG}: ${COMMIT_TITLE}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish New GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
