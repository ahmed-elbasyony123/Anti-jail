name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Arti Tor Native Libraries
        working-directory: ./rust/arti-mobile
        run: |
          mkdir -p ../../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o ../../android/app/src/main/jniLibs build --release

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview (debug build)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Debug-signed APK with Embedded Arti Tor engine. Uses wire protocol v2.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: "GhostKey v2.4.0 (Zero-Leakage Tor Push Notifications & Background Alerts)"
          body: |
            ### 🔔 GhostKey v2.4.0 (Zero-Leakage Tor Push Notifications & Background Alerts)
            - **Tor Push Notifications (Zero Google FCM):** 100% private, tracker-free background push notifications delivered directly over Tor Onion WebSocket circuits without Google Play Services or third-party telemetry.
            - **Stealth Notification Policy:** Sanitized lockscreen notifications (`VISIBILITY_PRIVATE`) masking sensitive sender fingerprints and message text from shoulder surfers.
            - **Distinct Payload Badges:** Context-aware alerts for encrypted Opus voice notes (`🎙️ Encrypted Opus voice note`), file attachments (`📎 Encrypted file attachment`), and text messages (`💬 New encrypted message`).
            - **Web Companion Alerts:** Integrated Web Desktop Notifications API for instant background message alerts when the browser tab is hidden.
            - **Embedded Arti Tor Engine (Rust):** Official in-process Tor routing engine (`arti-client`) with zero external app dependencies.
            - **Encrypted Opus PTT Voice Messaging:** High-fidelity RAM-only voice notes with panic wipe sanitization.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
