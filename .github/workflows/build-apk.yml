name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview (debug build)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Debug-signed APK, not independently audited. Uses wire protocol v2, so it only
            works with a relay running the matching v2 server code.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "GhostKey v2.0.0 (Protocol v2 & Security Hardening)"
          body: |
            ### 🛡️ GhostKey v2.0.0 (Protocol v2 & Security Hardening)
            - **Wire Protocol v2:** Random drop IDs, hashed read-tokens, and ACK-based message deletion
            - **Modern Cryptography:** Ed25519 (sign/certify) + X25519 (encryption) OpenPGP v4 (BouncyCastle 1.78)
            - **Signed-then-Encrypted Messages:** Payloads are signed with sender's key; recipient UI shows verified/invalid status
            - **Hardware-Backed Storage:** Identity saved via AndroidKeyStore AES-256-GCM; messages remain RAM-only
            - **Anti-Forensics:** Android FLAG_SECURE, Ephemeral mode, App lock (biometric/PIN), and one-tap Burn Identity
            - **Traffic Analysis Defense:** Uniform bucket padding (512 B / 16 KB)
            - **Tor Integration:** SOCKS5 proxy with remote DNS leak protection, Orbot auto-discovery, exponential backoff
            - **UI Polish:** Auto-scroll on new messages & keyboard show; collapsible key bar into bottom sheet
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
