name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Cache Arti Native Libraries (libarti_mobile.so)
        id: cache-arti
        uses: actions/cache@v6
        with:
          path: android/app/src/main/jniLibs
          key: arti-jni-arm64-v2-${{ hashFiles('rust/arti-mobile/**') }}

      - name: Set up Rust Toolchain
        if: steps.cache-arti.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        if: steps.cache-arti.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Build Arti Tor Native Libraries (arm64-v8a)
        if: steps.cache-arti.outputs.cache-hit != 'true'
        working-directory: ./rust/arti-mobile
        run: |
          mkdir -p ../../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a --platform 26 -o ../../android/app/src/main/jniLibs build --release

      - name: Decode Release Keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 --decode > android/keystore/ghostkey-release.jks

      - name: Run Unit Tests & Build Shrunk Release APK
        working-directory: ./android
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/ghostkey-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            R8-shrunk APK with Embedded Arti Tor engine. Uses wire protocol v2.
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Tag from versionName & Compute Release Metadata
        if: github.ref == 'refs/heads/main'
        id: release_meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts || echo "3.0.1")
          TAG="v${VERSION}"

          # Create annotated git tag if it doesn't exist yet on this commit
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "GhostKey ${TAG}"
            git push origin "$TAG"
            echo "Created new tag: $TAG"
          else
            EXISTING=$(git rev-parse "$TAG")
            CURRENT=$(git rev-parse HEAD)
            if [ "$EXISTING" != "$CURRENT" ]; then
              # versionName unchanged but code changed — append build number
              TAG="${TAG}-build.${{ github.run_number }}"
              echo "Tag exists on different commit, using: $TAG"
            else
              echo "Tag $TAG already points to HEAD, reusing."
            fi
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          echo "title=GhostKey ${TAG}: ${COMMIT_TITLE}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish New GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
