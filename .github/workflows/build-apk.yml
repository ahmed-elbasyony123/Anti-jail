name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-standalone
          name: "GhostKey v1.1.0 Standalone APK"
          body: |
            ### 🛡️ GhostKey v1.1.0 Standalone (Self-Contained OpenPGP)
            - **No External Apps Required:** Built-in in-memory OpenPGP engine (BouncyCastle 1.78)
            - **Instant Peer Paste:** Paste your peer's public key directly in the app
            - **Deterministic 30-Digit Safety Code:** MITM defense matches web companion
            - **ISP Anonymity:** Tor SOCKS5 routing (Orbot 9050) & RAM-only mailbox
            - **Full Multimedia Support:** Encrypt and exchange photos, audio, documents
            - **Anti-Forensics:** Android FLAG_SECURE & Emergency Panic Wipe
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
