name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Arti Tor Native Libraries
        working-directory: ./rust/arti-mobile
        run: |
          mkdir -p ../../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o ../../android/app/src/main/jniLibs build --release

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview (debug build)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Debug-signed APK with Embedded Arti Tor engine. Uses wire protocol v2.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.1
          name: "GhostKey v2.5.1 (Standalone In-Process Arti Tor Fix & DNS Routing)"
          body: |
            ### 🚀 GhostKey v2.5.1 (Standalone In-Process Arti Tor Fix & DNS Routing)
            - **Standalone Tor Engine Fix (Zero-Orbot Dependency):**
              - Disabled Android filesystem ownership verification (`ARTI_FS_DISABLE_PERMISSION_CHECKS`) which previously prevented Arti from starting on Android's multi-user sandbox paths (`/data/user/0/...`).
              - Immediate SOCKS5 ephemeral port binding before background bootstrap, ensuring OkHttp never times out or drops proxy requests.
              - Multi-threaded asynchronous Arti lifecycle managed off the Android UI thread (`Dispatchers.IO`).
            - **Smart DNS & Onion Routing:**
              - Selective `.onion` dummy address routing preventing DNS leaks while preserving standard direct IP connections (e.g. cloud relay servers).
            - **New Telegram UI & Anthropic Official Cream Palette:**
              - Complete overhaul with conversation lists, floating capsule input, navigation drawer (`☰`), and dedicated grouped Settings.
            - **Zero-Metadata E2EE Group Chats:**
              - Multi-recipient AES-256-GCM symmetric session keys wrapped in OpenPGP envelopes.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
