name: Build GhostKey APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Arti Tor Native Libraries
        working-directory: ./rust/arti-mobile
        run: |
          mkdir -p ../../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o ../../android/app/src/main/jniLibs build --release

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostKey-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v2 preview pre-release (feature branches only)
        if: startsWith(github.ref, 'refs/heads/feat/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview
          name: "GhostKey v2 preview (debug build)"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Preview build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Debug-signed APK with Embedded Arti Tor engine. Uses wire protocol v2.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: "GhostKey v2.5.0 (Telegram UI, Anthropic Palette & E2EE Group Chats)"
          body: |
            ### 📱 GhostKey v2.5.0 (New Telegram UI, Anthropic Palette & E2EE Group Chats)
            - **New Telegram UI Layout:**
              - Clean conversations list with initials avatars, unread badges, timestamps, and Floating Action Button (`+`).
              - Navigation Drawer (`☰`) containing Identity Card, Drop ID, Fingerprint Copy, Tor circuit live telemetry, and Panic Wipe.
              - Clutter-free Chat Screen: Removed top KeyBar clutter; replaced with Telegram asymmetric bubbles (`20dp`/`4dp`), inline time stamps, and read receipts (`✓✓`).
              - Floating pill capsule input bar with morphing voice note mic button and audio waveform player.
              - Dedicated grouped Settings screen for Tor Network, Push Notifications, Device Privacy, and Security Keys.
            - **Anthropic Official Brand Palette:** Creamy & warm terracotta styling (`#FAF9F5`, `#141413`, `#D97757`, `#788C5D`, `#6A9BCC`).
            - **Zero-Metadata E2EE Group Chats:** Group messaging using AES-256-GCM symmetric session encryption distributed pairwise via OpenPGP envelopes over shared `GroupDropId` blind relays.
            - **Hardware-Backed Contacts & Identity Aliases:** User-friendly aliases authenticated inside OpenPGP User IDs (`Alias <ghostkey drop:ID>`) and persisted in KeyStore-encrypted `SecureStore`.
            - **Tor & Relay Connectivity Fixes:** In-process Arti DNS lookup fallback directly sending `.onion` hosts to SOCKS5 (ATYP `0x03`), eliminating Orbot requirement.
            - **Brave Tor / Tor Browser Alerts:** Audio chime (Web Audio API) and title blinking when browser permissions block HTML5 system notifications.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
